[project]
name = "ds-canvas"
version = "0.4.0"
description = "Validate DS REASONS canvas spec files (executable design contracts for DS/ML projects)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
ds-canvas = "ds_canvas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_canvas"]
